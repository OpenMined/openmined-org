# amplify.yml — AWS Amplify Hosting build spec (static deploy of dist/client).
#
# This deploys the STATIC half of the build only. The one on-demand route
# (src/pages/api/create-donation.ts) is a Cloudflare Worker entry that Amplify
# cannot run — without it the donate modal degrades to its built-in error
# message (fetch → HTML 404 → catch path). See README "Deploy" for the
# Cloudflare story; headers are ported to customHttp.yml because Amplify does
# not read the Cloudflare _headers file.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # CI builds on Node 22 (.github/workflows/ci.yml) — match it here.
        - nvm use 22
        # --cache .npm parks npm's download cache at the project root, where
        # cache.paths below can persist it; --prefer-offline then installs from
        # those cached tarballs instead of the network. (`npm ci` itself always
        # deletes node_modules wholesale before installing — that's why neither
        # cache can live inside node_modules; see cache.paths.)
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # PRERENDER_ENV=node: Amplify's build containers can't boot workerd —
        # see the prerenderEnvironment note in astro.config.mjs.
        - PRERENDER_ENV=node npm run build
  # NO postBuild redirect sync here, and no AWS calls at all: builds only get
  # AWS credentials via an app service role, and a service role's presence
  # silently disables PR preview creation (verified 2026-08-14). The sync runs
  # from .github/workflows/sync-redirects.yml instead.
  artifacts:
    baseDirectory: dist/client
    files:
      - '**/*'
  # Amplify restores these paths before preBuild and saves them after a
  # successful build. node_modules is deliberately NOT cached: `npm ci`
  # deletes it before installing, so a restored node_modules is pure tar/
  # upload overhead that never survives to the build (AWS acknowledges the
  # conflict — aws-amplify/amplify-hosting#2831). The two dirs below are
  # project-root precisely so `npm ci` can't touch them.
  cache:
    paths:
      # Astro's build cache (astro.config.mjs → cacheDir): content-addressed
      # image variants, content-layer data store, self-hosted fonts. This is
      # what stops every deploy re-optimizing every image on the site. First
      # build after a cache reset is cold (populates); the win shows from the
      # second build on ("generating optimized images" drops to sub-second).
      - .astro-cache/**/*
      # npm's download cache (see preBuild) — clean installs without the network.
      - .npm/**/*
