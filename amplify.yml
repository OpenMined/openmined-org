# amplify.yml — AWS Amplify Hosting build spec (static deploy of dist/client).
#
# This deploys the STATIC half of the build only. The one on-demand route
# (src/pages/api/create-donation.ts) is a Cloudflare Worker entry that Amplify
# cannot run — without it the donate modal degrades to its built-in error
# message (fetch → HTML 404 → catch path). See README "Deploy" for the
# Cloudflare story; headers are ported to customHttp.yml because Amplify does
# not read the Cloudflare _headers file.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # CI builds on Node 22 (.github/workflows/ci.yml) — match it here.
        - nvm use 22
        - npm ci
    build:
      commands:
        # PRERENDER_ENV=node: Amplify's build containers can't boot workerd —
        # see the prerenderEnvironment note in astro.config.mjs.
        - PRERENDER_ENV=node npm run build
    postBuild:
      commands:
        # Redirect sync — Amplify doesn't read _redirects, so the built rule
        # set is pushed as app-level custom rules (see the script header).
        # Staging-branch builds ONLY: rules are app-wide, so PR previews must
        # never rewrite them. Flip the gate to "main" at cutover (LAUNCH.md).
        - if [ "$AWS_BRANCH" = "staging" ]; then node scripts/sync-amplify-redirects.mjs; fi
  artifacts:
    baseDirectory: dist/client
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
