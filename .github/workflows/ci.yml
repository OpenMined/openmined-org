# CI — type-check, full build, and the deterministic regression guards.
#
# NOTE: this file is staged for the standalone repo. While this folder still
# lives inside the migration repo, GitHub never reads it (workflows only run
# from the repository root's .github/); it activates automatically when this
# folder becomes the repo root.
#
# The Pagefind search index is built by an integration (integrations/pagefind.mjs),
# not a chained npm script, so any build command produces it and a failed index
# fails the build.
#
# Which guards run here, and why only these two: both are deterministic and need
# no browser and no network, so they can never flake. The rest of the kit in
# scripts/ is deliberately NOT wired in — audit:overflow needs a browser and a
# running preview server, audit:currencies calls an external API, and smoke /
# verify:donate need a live deployment. Run those locally or against a deploy.
# See README for the full kit.
name: CI

on:
  push:
    # Both deploying branches: a merge commit can differ from what the PR's CI
    # built (semantic conflicts land only in the merge), so the branch that
    # actually deploys needs its own run — staging today, main from cutover.
    branches: [main, staging]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Astro's build cache (astro.config.mjs → cacheDir) — the same dir
      # amplify.yml persists between hosted builds, for the same reason: without
      # it every run re-optimizes all ~1800 image variants and the build step
      # measures ~87s against ~15s warm (2026-09-03). Entries are
      # content-addressed, so restoring any prior cache is safe — a stale entry
      # is never matched, and new sources simply populate on top.
      #
      # The key ends in run_id so every run SAVES (actions/cache only writes on a
      # key miss); restore-keys then match the newest prior entry by prefix. The
      # lockfile sits in the prefix so a dependency bump prefers a cache built
      # with the same toolchain, falling back to any cache rather than cold.
      #
      # Scope matters here: a pull_request run can read caches written by its
      # BASE branch, but caches it writes stay private to the PR. So the push
      # runs on `main` and `staging` below are what populate the cache PRs
      # actually hit — one more reason those runs stay in the trigger list.
      - uses: actions/cache@v4
        with:
          path: .astro-cache
          key: astro-cache-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            astro-cache-${{ hashFiles('package-lock.json') }}-
            astro-cache-

      - run: npm run check
      - run: npm run build

      # Source guard: no image call may force a non-native aspect ratio.
      - name: Audit image shapes
        run: npm run audit:images

      # Build-output guard: every local asset URL in the built HTML resolves.
      # Catches the adapter's imageService default silently emitting /_image?…
      # endpoint URLs, which broke most of the site while the build stayed green.
      - name: Audit image URLs
        run: npm run audit:image-urls

      # public/ is served byte-for-byte — Astro never inspects it, so neither
      # guard above can see an oversized payload there. Catches a raster
      # embedded in an SVG far above its display size, and any file over the
      # budget for its type.
      - name: Audit public assets
        run: npm run audit:assets

      # Build-output guard: the merged _headers must stay parseable and complete.
      # Every way that file breaks is silent — a dropped header changes nothing
      # on the page, and an indented comment misparses without error. Also
      # catches a Cache-Control in a broad rule suppressing the adapter's
      # immutable-asset injection, which it only reports at debug level.
      - name: Audit headers
        run: npm run audit:headers
